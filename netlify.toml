[build]
command = "npm run build:static"
publish = "dist/client"

[build.environment]
NODE_VERSION = "22"

[[headers]]
for = "/models/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/*"
[headers.values]
Referrer-Policy = "strict-origin-when-cross-origin"
X-Content-Type-Options = "nosniff"
